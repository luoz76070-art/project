services:
  library-manage:
    build:
      context: .
      dockerfile: Dockerfile
    image: library-manage:latest
    container_name: library-manage
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: file:/app/data/library.db
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-please-change-this-secret-in-production-environment-xyz}
      AUTH_SECRET: ${AUTH_SECRET:-please-change-this-secret-in-production-environment-xyz}
      AUTH_TRUST_HOST: "true"
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://api.MiniMax.com/v1}
      AI_MODEL: ${AI_MODEL:-MiniMax-M2}
    volumes:
      - library-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - library-net

  # Optional: Cloudflare Quick Tunnel for public access (no account needed)
  # Uncomment the following block to expose your local container via a public trycloudflare.com URL.
  # Once enabled, run `docker compose logs cloudflared` to see the assigned URL.
  #
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: library-manage-tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate --url http://library-manage:3000
  #   depends_on:
  #     library-manage:
  #       condition: service_healthy
  #   networks:
  #     - library-net

volumes:
  library-data:
    name: library-manage-data

networks:
  library-net:
    name: library-manage-net
    driver: bridge