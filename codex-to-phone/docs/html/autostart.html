<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Mobile Codex 开机自启</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; margin: 32px; line-height: 1.65; color: #172033; }
    code, pre { background: #f3f6f8; padding: 2px 5px; border-radius: 4px; }
    pre { padding: 12px; overflow: auto; }
  </style>
</head>
<body>
  <h1>开机自启</h1>
  <p>管理器第一版使用当前用户启动文件夹创建快捷方式，不写系统服务，不改注册表全局项。</p>
  <p>启用后，当前 Windows 用户登录时会自动启动 Mobile Codex Relay。</p>
  <p>如果移动项目目录，需重新启用一次自启。</p>
</body>
</html>
