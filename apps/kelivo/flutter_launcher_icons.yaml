flutter_launcher_icons:
  # Android VectorDrawables are generated by tool/prepare_mobicodex_branding.py.
  android: false
  ios: true
  image_path: assets/app_icon_2.png
  image_path_ios: "assets/app_icon_2.png"
  image_path_ios_dark_transparent: "assets/app_icon_foreground.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon_2.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/app_icon_macos2.png"
